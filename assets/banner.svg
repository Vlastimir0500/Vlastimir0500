<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
xmlns:xlink="http://www.w3.org/1999/xlink"
width="900"
height="460"
viewBox="0 0 900 460">

<defs>

<!-- =========================
     BACKGROUND
========================= -->

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d1017"/>
    <stop offset="100%" stop-color="#0b0d13"/>
</linearGradient>

<pattern
id="grid"
width="32"
height="32"
patternUnits="userSpaceOnUse">

<path
d="M32 0H0V32"
fill="none"
stroke="#20242d"
stroke-width="1"/>

</pattern>

<filter id="glow">

<feGaussianBlur
stdDeviation="5"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

<style>

text{

font-family:
JetBrains Mono,
IBM Plex Mono,
monospace;

fill:#f5f5f5;

}

.title{

font-size:28px;
font-weight:bold;
letter-spacing:2px;

}

.subtitle{

font-size:13px;
fill:#b6b6b6;

}

.label{

font-size:12px;
fill:#cfcfcf;

}

.small{

font-size:11px;
fill:#888;

}

.barbg{

fill:#20242d;

}

.cpu{

fill:#74d46d;

}

.ram{

fill:#7aa2ff;

}

.gpu{

fill:#f0a35d;

}

.panel{

fill:#11151d;

stroke:#222831;

stroke-width:1;

rx:16;

}

.gridline{

stroke:#2f6fd8;

stroke-width:2;

stroke-linecap:round;

}

</style>

</defs>

<!-- Background -->

<rect
width="900"
height="460"
fill="url(#bg)"/>

<rect
width="900"
height="460"
fill="url(#grid)"
opacity=".25"/>

<!-- Main Card -->

<rect
x="28"
y="28"
width="844"
height="404"
rx="18"
class="panel"/>

<!-- Left Section -->

<text
x="70"
y="92"
font-size="18">

&gt;

</text>

<text
x="110"
y="92"
font-size="28">

whoami

</text>

<text
class="title"
x="70"
y="145">

VLASTIMIR

</text>

<text
class="subtitle"
x="70"
y="182">

AI • Cybersecurity • Python • Open Source

</text>

<!-- Divider -->

<line
x1="390"
y1="82"
x2="390"
y2="184"
class="gridline"/>

<!-- =========================
     RIGHT STATUS PANEL
========================= -->

<text
class="label"
x="560"
y="92">

CPU

</text>

<rect
x="560"
y="108"
width="170"
height="8"
rx="4"
class="barbg"/>

<rect
x="560"
y="108"
width="108"
height="8"
rx="4"
class="cpu"/>

<text
class="label"
x="560"
y="144">

RAM

</text>

<rect
x="560"
y="160"
width="170"
height="8"
rx="4"
class="barbg"/>

<rect
x="560"
y="160"
width="126"
height="8"
rx="4"
class="ram"/>

<text
class="label"
x="560"
y="196">

GPU

</text>

<rect
x="560"
y="212"
width="170"
height="8"
rx="4"
class="barbg"/>

<rect
x="560"
y="212"
width="98"
height="8"
rx="4"
class="gpu"/>

<!-- =========================
     GRAPH
========================= -->

<g
stroke="#7aa2ff"
stroke-width="2"
fill="none"
stroke-linecap="round">

<line x1="770" y1="104" x2="820" y2="145"/>

<line x1="820" y1="145" x2="875" y2="110"/>

<line x1="820" y1="145" x2="770" y2="186"/>

<line x1="820" y1="145" x2="875" y2="212"/>

</g>

<g fill="#7aa2ff">

<circle cx="770" cy="104" r="6"/>

<circle cx="820" cy="145" r="6"/>

<circle cx="875" cy="110" r="6"/>

<circle cx="770" cy="186" r="6"/>

<circle cx="875" cy="212" r="6"/>

<circle cx="905" cy="220" r="2"/>

<circle cx="892" cy="250" r="2"/>

<circle cx="858" cy="258" r="2"/>

</g>

<!-- =========================
     TERMINAL
========================= -->

<rect
x="70"
y="232"
width="340"
height="74"
rx="10"
fill="#050608"
stroke="#262c34"/>

<text
x="86"
y="254"
fill="#7CFF7C"
font-size="13">

$ status

</text>

<text
x="86"
y="278"
fill="#ffffff"
font-size="13">

Learning Python...

</text>

<text
x="86"
y="298"
fill="#7aa2ff"
font-size="13">

Building GitHub Profile...

</text>
<!-- =========================
     CENTER GLOW
========================= -->

<circle
cx="390"
cy="133"
r="12"
fill="#7aa2ff"
opacity=".18"
filter="url(#glow)"/>

<!-- =========================
     TITLE GLOW
========================= -->

<text
x="70"
y="145"
class="title"
fill="#7aa2ff"
opacity=".18"
filter="url(#glow)">

VLASTIMIR

</text>

<!-- =========================
     TERMINAL CURSOR
========================= -->

<rect
x="235"
y="287"
width="7"
height="12"
fill="#7aa2ff">

<animate
attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>

</rect>

<!-- =========================
     GRAPH PULSE
========================= -->

<circle
cx="820"
cy="145"
r="7"
fill="#7aa2ff">

<animate
attributeName="r"
values="6;8;6"
dur="2s"
repeatCount="indefinite"/>

</circle>

<!-- =========================
     CPU BAR
========================= -->

<rect
x="560"
y="108"
width="108"
height="8"
rx="4"
class="cpu">

<animate
attributeName="width"
values="100;118;108"
dur="6s"
repeatCount="indefinite"/>

</rect>

<!-- =========================
     RAM BAR
========================= -->

<rect
x="560"
y="160"
width="126"
height="8"
rx="4"
class="ram">

<animate
attributeName="width"
values="120;140;126"
dur="7s"
repeatCount="indefinite"/>

</rect>

<!-- =========================
     GPU BAR
========================= -->

<rect
x="560"
y="212"
width="98"
height="8"
rx="4"
class="gpu">

<animate
attributeName="width"
values="90;110;98"
dur="5s"
repeatCount="indefinite"/>

</rect>

<!-- =========================
     CARD HIGHLIGHT
========================= -->

<rect
x="28"
y="28"
width="844"
height="404"
rx="18"
fill="none"
stroke="#3a4250"
stroke-opacity=".35"/>

</svg>
