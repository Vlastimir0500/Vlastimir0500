<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 500"
     width="1600"
     height="500">

    <defs>

        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#030304"/>
            <stop offset="100%" stop-color="#000000"/>
        </linearGradient>

        <radialGradient id="nebula">
            <stop offset="0%" stop-color="#6D5DFB" stop-opacity=".20"/>
            <stop offset="50%" stop-color="#60A5FA" stop-opacity=".08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <style>
            text{
                fill:#f5f5f5;
                font-family:JetBrains Mono,IBM Plex Mono,monospace;
            }

            .title{
                font-size:34px;
                font-weight:bold;
                letter-spacing:3px;
            }

            .small{
                font-size:15px;
                fill:#bfbfbf;
            }

            .panel{
                fill:none;
                stroke:#242424;
                stroke-width:1.2;
                rx:12;
            }

            .bar-bg{
                fill:#111;
            }

            .bar{
                fill:#8B5CF6;
            }

        </style>

    </defs>

    <!-- Background -->

    <rect width="1600" height="500" fill="url(#bg)"/>

    <!-- Nebula -->

    <circle
        cx="800"
        cy="250"
        r="260"
        fill="url(#nebula)"/>

    <!-- Stars -->

    <g fill="white" opacity=".75">

        <circle cx="80" cy="60" r="1"/>
        <circle cx="220" cy="130" r="1"/>
        <circle cx="350" cy="90" r="1.2"/>
        <circle cx="510" cy="160" r="1"/>
        <circle cx="680" cy="70" r="1"/>
        <circle cx="900" cy="90" r="1"/>
        <circle cx="1120" cy="140" r="1.1"/>
        <circle cx="1290" cy="70" r="1"/>
        <circle cx="1460" cy="180" r="1"/>

        <circle cx="150" cy="420" r="1"/>
        <circle cx="520" cy="430" r="1"/>
        <circle cx="970" cy="400" r="1"/>
        <circle cx="1410" cy="380" r="1"/>

    </g>

    <!-- LEFT PANEL -->

    <rect x="35" y="35" width="320" height="260" class="panel"/>

    <text x="60" y="70">SYSTEM OVERVIEW</text>

    <text class="small" x="60" y="110">CPU</text>
    <rect class="bar-bg" x="120" y="98" width="170" height="8"/>
    <rect class="bar" x="120" y="98" width="110" height="8"/>

    <text class="small" x="60" y="145">RAM</text>
    <rect class="bar-bg" x="120" y="133" width="170" height="8"/>
    <rect class="bar" x="120" y="133" width="130" height="8"/>

    <text class="small" x="60" y="180">GPU</text>
    <rect class="bar-bg" x="120" y="168" width="170" height="8"/>
    <rect class="bar" x="120" y="168" width="145" height="8"/>

    <text class="small" x="60" y="215">SSD</text>
    <rect class="bar-bg" x="120" y="203" width="170" height="8"/>
    <rect class="bar" x="120" y="203" width="95" height="8"/>

    <!-- CENTER -->

    <circle
        cx="800"
        cy="165"
        r="26"
        fill="#000"
        stroke="#777"
        stroke-width="2"/>

    <text
        class="title"
        x="800"
        y="285"
        text-anchor="middle">

        COMPUTATIONAL SINGULARITY

    </text>

    <text
        class="small"
        x="800"
        y="315"
        text-anchor="middle">

        AI • SYSTEMS • CYBERSECURITY • RESEARCH

    </text>

    <text
        class="small"
        x="800"
        y="345"
        text-anchor="middle"
        fill="#888">

        "Reality is Information."

    </text>

    <!-- RIGHT PANEL -->

    <rect x="1245" y="35" width="320" height="260" class="panel"/>

    <text x="1270" y="70">GRINDING MODE</text>

    <text class="small" x="1270" y="110">LEETCODE</text>
    <rect class="bar-bg" x="1380" y="98" width="150" height="8"/>
    <rect class="bar" x="1380" y="98" width="95" height="8"/>

    <text class="small" x="1270" y="145">TRYHACKME</text>
    <rect class="bar-bg" x="1380" y="133" width="150" height="8"/>
    <rect class="bar" x="1380" y="133" width="120" height="8"/>

    <text class="small" x="1270" y="180">PYTHON</text>
    <rect class="bar-bg" x="1380" y="168" width="150" height="8"/>
    <rect class="bar" x="1380" y="168" width="105" height="8"/>

    <text class="small" x="1270" y="215">RESEARCH</text>
    <rect class="bar-bg" x="1380" y="203" width="150" height="8"/>
    <rect class="bar" x="1380" y="203" width="80" height="8"/>

    <!-- TERMINAL -->

    <rect x="35" y="340" width="520" height="120" class="panel"/>

    <text x="55" y="370">$ status</text>

    <text class="small" x="55" y="400">&gt; Building projects</text>

    <text class="small" x="55" y="425">&gt; Solving problems</text>

    <text class="small" x="55" y="450">&gt; Reading papers</text>

    <!-- TODAY -->

    <rect x="1045" y="340" width="520" height="120" class="panel"/>

    <text x="1070" y="370">TODAY</text>

    <text class="small" x="1070" y="400">LeetCode : 2 / 2</text>

    <text class="small" x="1070" y="425">TryHackMe : 2 / 2</text>

    <text class="small" x="1070" y="450">Research : 1 / 1</text>

</svg>

<!-- CENTER GLOW -->

<circle
cx="800"
cy="165"
r="70"
fill="url(#centerGlow)"
filter="url(#softGlow)"
opacity=".5">

<animate
attributeName="opacity"
values=".25;.6;.25"
dur="4s"
repeatCount="indefinite"/>

</circle>

<!-- ROTATING RING -->

<ellipse
cx="800"
cy="165"
rx="72"
ry="18"
fill="none"
stroke="#ffffff"
stroke-opacity=".4"
stroke-width="2">

<animateTransform
attributeName="transform"
type="rotate"
from="0 800 165"
to="360 800 165"
dur="35s"
repeatCount="indefinite"/>

</ellipse>

<!-- INNER RING -->

<ellipse
cx="800"
cy="165"
rx="58"
ry="14"
fill="none"
stroke="#60A5FA"
stroke-opacity=".5"
stroke-width="1">

<animateTransform
attributeName="transform"
type="rotate"
from="360 800 165"
to="0 800 165"
dur="18s"
repeatCount="indefinite"/>

</ellipse>

<!-- BLACK HOLE -->

<circle
cx="800"
cy="165"
r="24"
fill="#000"/>

<!-- TWINKLING STARS -->

<g fill="#ffffff">

<circle cx="120" cy="90" r="1">

<animate
attributeName="opacity"
values=".2;1;.2"
dur="3s"
repeatCount="indefinite"/>

</circle>

<circle cx="540" cy="60" r="1">

<animate
attributeName="opacity"
values="1;.2;1"
dur="5s"
repeatCount="indefinite"/>

</circle>

<circle cx="1330" cy="120" r="1">

<animate
attributeName="opacity"
values=".3;1;.3"
dur="4s"
repeatCount="indefinite"/>

</circle>

</g>
<!-- BLINKING CURSOR -->

<rect
x="118"
y="358"
width="8"
height="15"
fill="#ffffff">

<animate
attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>

</rect>
