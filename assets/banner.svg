<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="900"
     viewBox="0 0 1600 900">

  <defs>

    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#04060D"/>
    </radialGradient>

    <!-- Blue Glow -->
    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#6EA8FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6EA8FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Orange Glow -->
    <radialGradient id="orangeGlow">
      <stop offset="0%" stop-color="#FFB35C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFB35C" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M40 0H0V40"
            fill="none"
            stroke="#171D30"
            stroke-width="1"/>

    </pattern>

    <!-- Soft Glow -->
    <filter id="softGlow">

      <feGaussianBlur stdDeviation="4"/>

    </filter>

    <style><![CDATA[

      .mono{
        font-family:Consolas,Menlo,Monaco,monospace;
      }

      .title{
        fill:#9FC3FF;
        font-size:28px;
        letter-spacing:3px;
      }

      .label{
        fill:#D7DEFF;
        font-size:16px;
      }

      .small{
        fill:#6F7898;
        font-size:13px;
      }

      .green{
        fill:#75FF9E;
      }

      .orange{
        fill:#FFB35C;
      }

    ]]></style>

  </defs>

  <!-- Background -->

  <rect width="1600"
        height="900"
        fill="url(#bg)"/>

  <!-- Ambient Glow -->

  <circle cx="260"
          cy="180"
          r="320"
          fill="url(#blueGlow)"/>

  <circle cx="1380"
          cy="170"
          r="260"
          fill="url(#orangeGlow)"/>

  <!-- Grid -->

  <rect width="1600"
        height="900"
        fill="url(#grid)"/>

</svg>
  <!-- ================================= -->
  <!-- FRAME -->
  <!-- ================================= -->

  <rect x="18"
        y="18"
        width="1564"
        height="864"
        rx="14"
        fill="none"
        stroke="#1C2740"
        stroke-width="1.5"/>

  <!-- Corner Marks -->

  <path d="M42 82 V42 H82"
        fill="none"
        stroke="#4F7EFF"
        stroke-width="2"/>

  <path d="M1518 42 H1558 V82"
        fill="none"
        stroke="#4F7EFF"
        stroke-width="2"/>

  <path d="M42 818 V858 H82"
        fill="none"
        stroke="#4F7EFF"
        stroke-width="2"/>

  <path d="M1518 858 H1558 V818"
        fill="none"
        stroke="#4F7EFF"
        stroke-width="2"/>

  <!-- ================================= -->
  <!-- HEADER -->
  <!-- ================================= -->

  <text x="48"
        y="58"
        class="mono title">
    VLASTIMIR // RESEARCH NODE
  </text>

  <text x="48"
        y="84"
        class="mono small">
    BUILD 3.0 • COMPUTATIONAL SYSTEM
  </text>

  <!-- ONLINE -->

  <circle cx="1450"
          cy="52"
          r="5"
          fill="#75FF9E">

      <animate attributeName="opacity"
               values="1;0.25;1"
               dur="2s"
               repeatCount="indefinite"/>

  </circle>

  <text x="1432"
        y="58"
        text-anchor="end"
        class="mono label">
    SYSTEM ONLINE
  </text>

  <!-- Divider -->

  <line x1="40"
        y1="98"
        x2="1560"
        y2="98"
        stroke="#1A2338"
        stroke-width="1"/>
