<svg width="1600" height="900"
     viewBox="0 0 1600 900"
     xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- =========================
     GRADIENTS
========================= -->

<radialGradient id="bgRad" cx="50%" cy="42%" r="75%">
    <stop offset="0%" stop-color="#0a0e18"/>
    <stop offset="100%" stop-color="#05060b"/>
</radialGradient>

<radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#000000"/>
    <stop offset="80%" stop-color="#020207"/>
    <stop offset="100%" stop-color="#07080f"/>
</radialGradient>

<radialGradient id="nebulaCyan" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#3fd0ff" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#3fd0ff" stop-opacity="0"/>
</radialGradient>

<radialGradient id="nebulaWarm" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff9d5c" stop-opacity="0.13"/>
    <stop offset="100%" stop-color="#ff9d5c" stop-opacity="0"/>
</radialGradient>

<!-- =========================
     GRID
========================= -->

<pattern id="grid"
         width="34"
         height="34"
         patternUnits="userSpaceOnUse">

    <path
        d="M34 0 L0 0 0 34"
        fill="none"
        stroke="#141a28"
        stroke-width="1"/>

</pattern>

<!-- =========================
     FILTERS
========================= -->

<filter id="glow"
        x="-80%"
        y="-80%"
        width="260%"
        height="260%">

    <feGaussianBlur stdDeviation="4" result="b"/>

    <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
    </feMerge>

</filter>

<filter id="glowSoft"
        x="-80%"
        y="-80%"
        width="260%"
        height="260%">

    <feGaussianBlur stdDeviation="1.6" result="b"/>

    <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
    </feMerge>

</filter>

<clipPath id="frame">
    <rect
        x="0"
        y="0"
        width="1600"
        height="900"
        rx="16"/>
</clipPath>

<!-- =========================
     STYLES
========================= -->

<style><![CDATA[

.mono{
    font-family:
    "SFMono-Regular",
    Consolas,
    "Liberation Mono",
    Menlo,
    monospace;
}

.hdr{
    fill:#9aa8ff;
    letter-spacing:3px;
    font-size:13px;
}

.lbl{
    fill:#b7bdd6;
    letter-spacing:.5px;
    font-size:13px;
}

.dim{
    fill:#6b7284;
    font-size:12px;
}

.val{
    fill:#c7cfff;
    font-size:13px;
}

.check{
    fill:#c9d3f2;
    font-size:13px;
}

.dots{
    stroke:#232941;
    stroke-width:1;
    stroke-dasharray:1 4;
}

/* ---------- Animations ---------- */

@keyframes twinkle{

    0%,100%{
        opacity:.25;
    }

    50%{
        opacity:1;
    }
}

@keyframes pulse{

    0%,100%{
        opacity:.88;
        transform:scale(1);
    }

    50%{
        opacity:1;
        transform:scale(1.025);
    }
}

@keyframes flicker{

    0%,100%{
        opacity:.85;
    }

    45%{
        opacity:.35;
    }

    55%{
        opacity:.85;
    }
}

@keyframes galaxySpin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes nebulaFloat{

    0%,100%{
        opacity:.18;
    }

    50%{
        opacity:.30;
    }
}

/* ---------- Classes ---------- */

.twinkle{
    animation:twinkle 3.4s ease-in-out infinite;
}

.node-pulse{
    animation:pulse 4s ease-in-out infinite;
}

.stream-row{
    animation:flicker 3.8s ease-in-out infinite;
}

.lensing{
    transform-origin:800px 480px;
    animation:galaxySpin 120s linear infinite;
}

.statuspulse{
    animation:pulse 2.2s ease-in-out infinite;
}

.nebula{
    animation:nebulaFloat 14s ease-in-out infinite;
}

]]></style>

</defs>

<g clip-path="url(#frame)">

<!-- Background -->

<rect
    width="1600"
    height="900"
    fill="url(#bgRad)"/>

<rect
    width="1600"
    height="900"
    fill="url(#grid)"/>

<!-- Nebula -->

<ellipse
    class="nebula"
    cx="180"
    cy="140"
    rx="340"
    ry="220"
    fill="url(#nebulaCyan)"/>

<ellipse
    class="nebula"
    cx="1440"
    cy="160"
    rx="360"
    ry="230"
    fill="url(#nebulaWarm)"/>
  <!-- =========================================
     STAR FIELD
========================================= -->

<defs>

    <!-- Small Star -->
    <circle id="star1" r="1.1" fill="#ffffff"/>

    <!-- Medium Star -->
    <circle id="star2" r="1.8" fill="#d8f3ff"/>

    <!-- Large Glow Star -->
    <circle id="star3" r="2.8"
            fill="#ffffff"
            filter="url(#glowSoft)"/>

</defs>

<g id="stars">

    <!-- Row 1 -->

    <use href="#star1" x="60" y="70" class="twinkle"/>
    <use href="#star2" x="170" y="110" class="twinkle" style="animation-delay:.8s"/>
    <use href="#star1" x="310" y="55" class="twinkle" style="animation-delay:1.7s"/>
    <use href="#star3" x="470" y="150" class="twinkle" style="animation-delay:2.4s"/>
    <use href="#star2" x="620" y="90" class="twinkle" style="animation-delay:.5s"/>
    <use href="#star1" x="760" y="120" class="twinkle" style="animation-delay:1.2s"/>
    <use href="#star3" x="930" y="60" class="twinkle" style="animation-delay:2.8s"/>
    <use href="#star1" x="1090" y="140" class="twinkle" style="animation-delay:1.4s"/>
    <use href="#star2" x="1240" y="80" class="twinkle" style="animation-delay:2.1s"/>
    <use href="#star1" x="1390" y="120" class="twinkle" style="animation-delay:.4s"/>
    <use href="#star3" x="1510" y="70" class="twinkle" style="animation-delay:2.6s"/>

    <!-- Row 2 -->

    <use href="#star2" x="90" y="250" class="twinkle" style="animation-delay:1.1s"/>
    <use href="#star1" x="230" y="330" class="twinkle" style="animation-delay:.7s"/>
    <use href="#star3" x="390" y="270" class="twinkle" style="animation-delay:2.9s"/>
    <use href="#star1" x="560" y="360" class="twinkle" style="animation-delay:1.5s"/>
    <use href="#star2" x="720" y="250" class="twinkle" style="animation-delay:.2s"/>
    <use href="#star1" x="860" y="340" class="twinkle" style="animation-delay:1.9s"/>
    <use href="#star3" x="1010" y="300" class="twinkle" style="animation-delay:2.5s"/>
    <use href="#star1" x="1170" y="240" class="twinkle" style="animation-delay:.9s"/>
    <use href="#star2" x="1330" y="330" class="twinkle" style="animation-delay:1.6s"/>
    <use href="#star1" x="1490" y="280" class="twinkle" style="animation-delay:2.3s"/>

    <!-- Row 3 -->

    <use href="#star1" x="120" y="520" class="twinkle" style="animation-delay:2.2s"/>
    <use href="#star2" x="280" y="450" class="twinkle" style="animation-delay:.3s"/>
    <use href="#star3" x="440" y="560" class="twinkle" style="animation-delay:1.8s"/>
    <use href="#star1" x="610" y="500" class="twinkle" style="animation-delay:2.6s"/>
    <use href="#star2" x="790" y="590" class="twinkle" style="animation-delay:.6s"/>
    <use href="#star1" x="950" y="470" class="twinkle" style="animation-delay:1.4s"/>
    <use href="#star3" x="1120" y="550" class="twinkle" style="animation-delay:2.7s"/>
    <use href="#star1" x="1280" y="460" class="twinkle" style="animation-delay:.8s"/>
    <use href="#star2" x="1450" y="520" class="twinkle" style="animation-delay:1.3s"/>

    <!-- Row 4 -->

    <use href="#star2" x="70" y="720" class="twinkle" style="animation-delay:1.6s"/>
    <use href="#star1" x="240" y="820" class="twinkle" style="animation-delay:2.2s"/>
    <use href="#star3" x="390" y="700" class="twinkle" style="animation-delay:.5s"/>
    <use href="#star1" x="580" y="790" class="twinkle" style="animation-delay:1.8s"/>
    <use href="#star2" x="760" y="730" class="twinkle" style="animation-delay:2.4s"/>
    <use href="#star1" x="930" y="840" class="twinkle" style="animation-delay:.9s"/>
    <use href="#star3" x="1110" y="710" class="twinkle" style="animation-delay:1.5s"/>
    <use href="#star1" x="1280" y="810" class="twinkle" style="animation-delay:2.8s"/>
    <use href="#star2" x="1460" y="760" class="twinkle" style="animation-delay:.4s"/>

</g>
