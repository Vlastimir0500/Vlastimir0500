current one the one i downloaded

Stopped thinking
I found the actual XML error.

Line 725
You have:

AI & Machine Learning
In XML/SVG, & is not allowed unless it's escaped.

Fix it
Replace:

AI & Machine Learning
with:

AI &amp; Machine Learning
or simply:

AI and Machine Learning
This is the parser error I got:

xmlParseEntityRef: no name, line 725
After fixing that, commit again.

If GitHub still reports an error, upload the updated file again. Now that we've fixed the first XML error, the parser will point to the next one (if any), and we'll clear them one by one.


