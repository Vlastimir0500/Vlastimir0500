<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500">

    <defs>

        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#020205"/>
            <stop offset="100%" stop-color="#000000"/>
        </linearGradient>

        <radialGradient id="nebula">
            <stop offset="0%" stop-color="#6f7dff" stop-opacity=".18"/>
            <stop offset="40%" stop-color="#6f7dff" stop-opacity=".08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path
                d="M40 0H0V40"
                fill="none"
                stroke="#ffffff"
                stroke-opacity=".03"
                stroke-width="1"/>
        </pattern>

    </defs>

    <!-- Background -->

    <rect
        width="1600"
        height="500"
        fill="url(#bg)"/>

    <!-- Nebula -->

    <circle
        cx="420"
        cy="250"
        r="320"
        fill="url(#nebula)"/>

    <!-- Grid -->

    <rect
        width="1600"
        height="500"
        fill="url(#grid)"/>

    <!-- Stars -->

    <g fill="white" opacity=".9">

        <circle cx="80" cy="90" r="1"/>
        <circle cx="160" cy="60" r="1.2"/>
        <circle cx="260" cy="180" r="1"/>
        <circle cx="390" cy="120" r="1"/>
        <circle cx="520" cy="70" r="1.3"/>
        <circle cx="690" cy="210" r="1"/>
        <circle cx="810" cy="110" r="1"/>
        <circle cx="980" cy="70" r="1.4"/>
        <circle cx="1120" cy="160" r="1"/>
        <circle cx="1240" cy="100" r="1"/>
        <circle cx="1380" cy="80" r="1.5"/>
        <circle cx="1500" cy="240" r="1"/>

    </g>

</svg>

<radialGradient id="halo">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".45"/>
    <stop offset="25%" stop-color="#b8c7ff" stop-opacity=".22"/>
    <stop offset="55%" stop-color="#7d7dff" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>

<radialGradient id="ringGlow">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="70%" stop-color="#fff5dc"/>
    <stop offset="100%" stop-color="#ffcf8f"/>
</radialGradient>

<filter id="blur20">
    <feGaussianBlur stdDeviation="20"/>
</filter>

<filter id="blur8">
    <feGaussianBlur stdDeviation="8"/>
</filter>
<!-- OUTER HALO -->

<circle
    cx="800"
    cy="250"
    r="180"
    fill="url(#halo)"
    filter="url(#blur20)"/>

<!-- SOFT GLOW -->

<circle
    cx="800"
    cy="250"
    r="140"
    fill="url(#halo)"
    opacity=".7"/>

<!-- ACCRETION DISK -->

<ellipse
    cx="800"
    cy="250"
    rx="175"
    ry="42"
    fill="none"
    stroke="url(#ringGlow)"
    stroke-width="14"
    opacity=".85"/>

<ellipse
    cx="800"
    cy="250"
    rx="162"
    ry="35"
    fill="none"
    stroke="#ffffff"
    stroke-opacity=".45"
    stroke-width="4"/>

<!-- PHOTON RING -->

<circle
    cx="800"
    cy="250"
    r="73"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"/>

<!-- EVENT HORIZON -->

<circle
    cx="800"
    cy="250"
    r="70"
    fill="#000000"/>
<!-- UPPER LENS -->

<path
d="
M640 240
C690 180 910 180 960 240
C910 215 690 215 640 240Z
"
fill="white"
opacity=".16"
filter="url(#blur8)"/>

<!-- LOWER LENS -->

<path
d="
M640 260
C690 320 910 320 960 260
C910 285 690 285 640 260Z
"
fill="white"
opacity=".05"
filter="url(#blur20)"/>

<g
stroke="white"
stroke-opacity=".12"
stroke-width="1.2">

<path d="M620 248 C700 218 900 218 980 248"/>

<path d="M630 255 C710 230 890 230 970 255"/>

<path d="M650 242 C720 214 880 214 950 242"/>

<path d="M640 266 C720 286 880 286 960 266"/>

</g>
<g fill="white">

<circle cx="985" cy="248" r="1.3"/>
<circle cx="995" cy="246" r="1"/>
<circle cx="1006" cy="244" r=".8"/>
<circle cx="1015" cy="243" r=".7"/>

<circle cx="612" cy="255" r=".9"/>
<circle cx="603" cy="257" r=".8"/>
<circle cx="596" cy="258" r=".6"/>

</g>
