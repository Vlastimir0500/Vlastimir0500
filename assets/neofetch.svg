<svg width="900" height="460"
viewBox="0 0 900 460"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0b1220"/>
    <stop offset="100%" stop-color="#171b2e"/>
</linearGradient>

<pattern id="grid"
width="28"
height="28"
patternUnits="userSpaceOnUse">
    <path
        d="M28 0H0V28"
        fill="none"
        stroke="#1b2740"
        stroke-width="0.6"/>
</pattern>

<filter id="shadow">
    <feDropShadow
        dx="0"
        dy="0"
        stdDeviation="12"
        flood-color="#6ea8ff"
        flood-opacity="0.20"/>
</filter>

<style>

text{
font-family:"JetBrains Mono","Fira Code","Consolas",monospace;
}

.title{
fill:#8893b8;
font-size:14px;
}

.prompt{
fill:#86efac;
font-size:17px;
font-weight:600;
}

.cursor{
fill:#7aa2ff;
}

</style>

</defs>

<!-- Window -->

<rect
x="20"
y="20"
width="860"
height="420"
rx="18"
fill="url(#bg)"
stroke="#2f3b5d"
stroke-width="2"
filter="url(#shadow)"/>

<!-- Grid -->

<rect
x="20"
y="20"
width="860"
height="420"
rx="18"
fill="url(#grid)"
opacity="0.22"/>

<!-- Title Bar -->

<rect
x="20"
y="20"
width="860"
height="46"
rx="18"
fill="#0b0f18"/>

<line
x1="20"
y1="66"
x2="880"
y2="66"
stroke="#29334f"/>

<circle cx="46" cy="43" r="6.5" fill="#ff5f56"/>
<circle cx="68" cy="43" r="6.5" fill="#ffbd2e"/>
<circle cx="90" cy="43" r="6.5" fill="#27c93f"/>

<text
x="450"
y="46"
text-anchor="middle"
class="title">
vlastimir@arch:~
</text>

<!-- Prompt -->

<text
x="45"
y="110"
class="prompt">

<tspan>vlastimir@arch:~$ fastfetch </tspan>

<tspan class="cursor">█</tspan>

</text>

<!-- ================= LEFT PANEL ================= -->

<line
x1="300"
y1="95"
x2="300"
y2="360"
stroke="#2b3654"
stroke-width="1"/>

<text
x="160"
y="150"
fill="#6ea8ff"
font-size="20"
font-weight="700"
text-anchor="middle">

<tspan x="160">        /\</tspan>
<tspan x="160" dy="24">       /  \</tspan>
<tspan x="160" dy="24">      / /\ \</tspan>
<tspan x="160" dy="24">     / /  \ \</tspan>
<tspan x="160" dy="24">    / /____\ \</tspan>
<tspan x="160" dy="24">   /_/      \_\</tspan>

</text>

<text
x="160"
y="325"
text-anchor="middle"
fill="#8b97b3"
font-size="15">

Arch Linux

</text>

<!-- ================= RIGHT PANEL ================= -->

<text
x="340"
y="110"
fill="#86efac"
font-size="17"
font-weight="600">

$ whoami

</text>

<text x="340" y="150" fill="#7aa2ff" font-size="15" font-weight="600">OS</text>
<text x="500" y="150" fill="#edf2ff" font-size="15">Arch Linux</text>

<text x="340" y="182" fill="#7aa2ff" font-size="15" font-weight="600">User</text>
<text x="500" y="182" fill="#edf2ff" font-size="15">Vlastimir</text>

<text x="340" y="214" fill="#7aa2ff" font-size="15" font-weight="600">Shell</text>
<text x="500" y="214" fill="#edf2ff" font-size="15">zsh</text>

<text x="340" y="246" fill="#7aa2ff" font-size="15" font-weight="600">Editor</text>
<text x="500" y="246" fill="#edf2ff" font-size="15">Neovim</text>

<text x="340" y="278" fill="#7aa2ff" font-size="15" font-weight="600">Terminal</text>
<text x="500" y="278" fill="#edf2ff" font-size="15">Ghostty</text>

<text x="340" y="310" fill="#7aa2ff" font-size="15" font-weight="600">Languages</text>
<text x="500" y="310" fill="#edf2ff" font-size="15">Python • C++</text>

<text x="340" y="342" fill="#7aa2ff" font-size="15" font-weight="600">Focus</text>
<text x="500" y="342" fill="#edf2ff" font-size="15">AI • Cybersecurity</text>

<!-- ================= TERMINAL ================= -->

<line
x1="35"
y1="380"
x2="865"
y2="380"
stroke="#29334f"/>

<text
x="45"
y="408"
fill="#86efac"
font-size="16">

vlastimir@arch:~$ python main.py

</text>

<text
x="70"
y="432"
fill="#d6e4ff"
font-size="15">

Building GitHub Profile Generator...

</text>

<text
x="45"
y="456"
fill="#86efac"
font-size="16">

vlastimir@arch:~$

</text>

<!-- Cursor -->

<rect
x="235"
y="444"
width="9"
height="16"
rx="1"
fill="#6ea8ff"/>
    </svg>

<animate
attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>

</rect>

