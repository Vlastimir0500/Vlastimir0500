<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="540"
     viewBox="0 0 900 540">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0b1020"/>
    <stop offset="100%" stop-color="#141a2d"/>
</linearGradient>

<radialGradient id="glow" cx="50%" cy="0%" r="100%">
    <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>

<filter id="shadow">
    <feDropShadow dx="0"
                  dy="0"
                  stdDeviation="12"
                  flood-color="#4f8cff"
                  flood-opacity="0.35"/>
</filter>

<style>

text{
font-family:"JetBrains Mono","Consolas",monospace;
}

.term{
fill:#f8fafc;
font-size:19px;
}

.label{
fill:#7aa7ff;
font-size:19px;
font-weight:bold;
}

.value{
fill:#edf2ff;
font-size:19px;
}

.green{
fill:#76ff8d;
font-size:19px;
}

.gray{
fill:#8a97b8;
font-size:18px;
}

.arch{
fill:#3ba6ff;
font-size:18px;
}

.cursor{
fill:#78a6ff;
animation:blink 1s infinite;
}

@keyframes blink{
0%,50%{opacity:1;}
51%,100%{opacity:0;}
}

</style>

</defs>

<!-- Background -->

<rect
width="900"
height="540"
fill="transparent"/>

<!-- Terminal -->

<rect
x="25"
y="25"
width="850"
height="490"
rx="18"
fill="url(#bg)"
stroke="#2d3654"
stroke-width="2"
filter="url(#shadow)"/>

<rect
x="25"
y="25"
width="850"
height="490"
rx="18"
fill="url(#glow)"/>

<!-- Title Bar -->

<circle cx="52" cy="50" r="8" fill="#ff5f57"/>
<circle cx="78" cy="50" r="8" fill="#febc2e"/>
<circle cx="104" cy="50" r="8" fill="#28c840"/>

<text
x="145"
y="56"
class="gray">
vlastimir@arch:~
</text>

<line
x1="25"
y1="76"
x2="875"
y2="76"
stroke="#28324d"/>

<!-- Prompt -->

<text
x="52"
y="120"
class="green">
$ fastfetch
</text>

<rect
x="182"
y="102"
width="8"
height="22"
class="cursor"/>

<!-- Divider -->

<line
x1="305"
y1="125"
x2="305"
y2="470"
stroke="#28324d"
stroke-width="2"/>

<!-- ================= LEFT : ARCH LOGO ================= -->

<text x="60" y="165" class="arch">          /\
</text>
<text x="60" y="188" class="arch">         /  \
</text>
<text x="60" y="211" class="arch">        / /\ \
</text>
<text x="60" y="234" class="arch">       / /  \ \
</text>
<text x="60" y="257" class="arch">      / / /\ \ \
</text>
<text x="60" y="280" class="arch">     / / ____ \ \
</text>
<text x="60" y="303" class="arch">    /_/ /    \ \_\
</text>

<text
x="95"
y="345"
class="gray">
Arch Linux
</text>

<!-- ================= RIGHT : FASTFETCH ================= -->

<text
x="340"
y="120"
class="green">
$ whoami
</text>

<text x="340" y="165" class="label">OS</text>
<text x="495" y="165" class="value">Arch Linux</text>

<text x="340" y="198" class="label">Host</text>
<text x="495" y="198" class="value">github.com</text>

<text x="340" y="231" class="label">User</text>
<text x="495" y="231" class="value">Vlastimir</text>

<text x="340" y="264" class="label">Shell</text>
<text x="495" y="264" class="value">zsh</text>

<text x="340" y="297" class="label">Editor</text>
<text x="495" y="297" class="value">Neovim</text>

<text x="340" y="330" class="label">Languages</text>
<text x="495" y="330" class="value">Python • C++</text>

<text x="340" y="363" class="label">Focus</text>
<text x="495" y="363" class="value">AI • Cybersecurity</text>

<text x="340" y="396" class="label">Learning</text>
<text x="495" y="396" class="value">LeetCode • TryHackMe</text>

<line
x1="340"
y1="425"
x2="835"
y2="425"
stroke="#28324d"/>

<text
x="340"
y="460"
class="green">
$ history
</text>

<!-- ================= TERMINAL SESSION ================= -->

<text x="340" y="490" class="term">vlastimir@arch:~$ python main.py</text>

<text x="365" y="520" class="green">
✓ Building GitHub profile...
</text>

<text x="340" y="555" class="term">
vlastimir@arch:~$ tryhackme
</text>

<text x="365" y="585" class="value">
Room: Linux Fundamentals
</text>

<text x="365" y="612" class="green">
✓ In Progress
</text>

<text x="340" y="647" class="term">
vlastimir@arch:~$ leetcode
</text>

<text x="365" y="677" class="value">
Today's Goal: 2 Problems
</text>

<text x="340" y="712" class="term">
vlastimir@arch:~$ git status
</text>

<text x="365" y="742" class="green">
On branch main
</text>

<text x="365" y="768" class="green">
nothing to commit, working tree clean
</text>

<!-- Bottom Prompt -->

<line
x1="25"
y1="475"
x2="875"
y2="475"
stroke="#28324d"/>

<text
x="45"
y="503"
class="green">
vlastimir@arch
</text>

<text
x="190"
y="503"
class="term">
:
</text>

<text
x="202"
y="503"
fill="#60a5fa"
font-size="19">
~
</text>

<text
x="216"
y="503"
class="term">
$
</text>

<rect
x="232"
y="485"
width="8"
height="20"
fill="#6ea8ff">

<animate
attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>

</rect>

</svg>
