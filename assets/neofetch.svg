<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>
    <clipPath id="roundClip">
      <rect x="0" y="0" width="900" height="600" rx="16" ry="16"/>
    </clipPath>
    <style>
      text { font-family: 'JetBrains Mono','Fira Code',Consolas,Menlo,monospace; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    </style>
  </defs>

  <!-- soft outer glow border -->
  <rect x="1" y="1" width="898" height="598" rx="16" ry="16" fill="none" stroke="url(#borderGlow)" stroke-width="1.5" opacity="0.55"/>

  <g clip-path="url(#roundClip)">
    <rect x="0" y="0" width="900" height="600" fill="#1a1b26"/>

    <!-- title bar -->
    <rect x="0" y="0" width="900" height="48" fill="#16161e"/>
    <line x1="0" y1="48" x2="900" y2="48" stroke="#292e42" stroke-width="1"/>
    <circle cx="28" cy="24" r="6.5" fill="#f7768e"/>
    <circle cx="50" cy="24" r="6.5" fill="#e0af68"/>
    <circle cx="72" cy="24" r="6.5" fill="#9ece6a"/>
    <text x="450" y="29" text-anchor="middle" font-size="13" fill="#565f89" font-weight="500">vlastimir@arch:~</text>

    <!-- vertical divider between columns -->
    <line x1="450" y1="72" x2="450" y2="410" stroke="#292e42" stroke-width="1"/>

    <!-- LEFT COLUMN: fastfetch -->
    <text x="42" y="130" font-size="16" fill="#c0caf5"><tspan fill="#9ece6a" font-weight="700">$</tspan> fastfetch</text>
    <rect x="150" y="117" width="9" height="16" fill="#9ece6a" class="blink"/>

    <text x="225" y="180" text-anchor="middle" font-size="17" font-weight="600" fill="#7aa2f7">
      <tspan x="225">/\</tspan>
      <tspan x="225" dy="25">/  \</tspan>
      <tspan x="225" dy="25">/ /\ \</tspan>
      <tspan x="225" dy="25">/ /  \ \</tspan>
      <tspan x="225" dy="25">/ /____\ \</tspan>
      <tspan x="225" dy="25">/_/    \_\</tspan>
    </text>
    <text x="225" y="345" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1" fill="#c0caf5">Arch Linux</text>

    <!-- RIGHT COLUMN: whoami -->
    <text x="490" y="130" font-size="16" fill="#c0caf5"><tspan fill="#9ece6a" font-weight="700">$</tspan> whoami</text>

    <text x="490" y="168" font-size="14.5" font-weight="600" fill="#bb9af7">OS</text>
    <text x="650" y="168" font-size="14.5" fill="#c0caf5">Arch Linux</text>

    <text x="490" y="198" font-size="14.5" font-weight="600" fill="#bb9af7">Host</text>
    <text x="650" y="198" font-size="14.5" fill="#c0caf5">github.com</text>

    <text x="490" y="228" font-size="14.5" font-weight="600" fill="#bb9af7">User</text>
    <text x="650" y="228" font-size="14.5" fill="#c0caf5">Vlastimir</text>

    <text x="490" y="258" font-size="14.5" font-weight="600" fill="#bb9af7">Shell</text>
    <text x="650" y="258" font-size="14.5" fill="#c0caf5">zsh</text>

    <text x="490" y="288" font-size="14.5" font-weight="600" fill="#bb9af7">Editor</text>
    <text x="650" y="288" font-size="14.5" fill="#c0caf5">Neovim</text>

    <text x="490" y="318" font-size="14.5" font-weight="600" fill="#bb9af7">Languages</text>
    <text x="650" y="318" font-size="14.5" fill="#c0caf5">Python &#8226; C++</text>

    <text x="490" y="348" font-size="14.5" font-weight="600" fill="#bb9af7">Focus</text>
    <text x="650" y="348" font-size="14.5" fill="#c0caf5">AI &#8226; Cybersecurity</text>

    <text x="490" y="378" font-size="14.5" font-weight="600" fill="#bb9af7">Learning</text>
    <text x="650" y="378" font-size="14.5" fill="#c0caf5">LeetCode &#8226; TryHackMe</text>

    <!-- separator before history -->
    <line x1="34" y1="410" x2="866" y2="410" stroke="#292e42" stroke-width="1"/>

    <!-- HISTORY SECTION -->
    <text x="42" y="450" font-size="16" fill="#c0caf5"><tspan fill="#9ece6a" font-weight="700">$</tspan> history</text>

    <text x="42" y="482" font-size="14" fill="#565f89">vlastimir@arch:~$<tspan fill="#c0caf5"> python main.py</tspan></text>

    <text x="42" y="508" font-size="14"><tspan fill="#9ece6a" font-weight="700">&#10003;</tspan><tspan fill="#c0caf5"> Building GitHub profile...</tspan></text>

    <!-- final prompt -->
    <text x="42" y="550" font-size="16" fill="#c0caf5">vlastimir@arch:~<tspan fill="#9ece6a" font-weight="700">$</tspan> </text>
    <rect x="224" y="537" width="9" height="17" fill="#9ece6a" class="blink"/>
  </g>

  <!-- crisp outer border -->
  <rect x="0.75" y="0.75" width="898.5" height="598.5" rx="15.25" ry="15.25" fill="none" stroke="#292e42" stroke-width="1.5"/>
</svg>
