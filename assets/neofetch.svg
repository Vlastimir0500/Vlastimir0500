<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="540"
     viewBox="0 0 900 540">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#0b1220"/>
  <stop offset="100%" stop-color="#161b2d"/>
</linearGradient>

<filter id="shadow">
  <feDropShadow dx="0"
                dy="0"
                stdDeviation="12"
                flood-color="#60a5fa"
                flood-opacity="0.25"/>
</filter>

<style>

text{
font-family:JetBrains Mono,Consolas,monospace;
}

.term{
fill:#d7dde8;
font-size:20px;
}

.label{
fill:#7fb2ff;
font-size:20px;
font-weight:600;
}

.value{
fill:#f8fafc;
font-size:20px;
}

.green{
fill:#7CFC8A;
font-size:20px;
}

.gray{
fill:#7f8ea8;
font-size:18px;
}

.arch{
fill:#37b4ff;
font-size:18px;
}

.cursor{
fill:#6ea8ff;
animation:blink 1s infinite;
}

@keyframes blink{
0%,50%{opacity:1;}
51%,100%{opacity:0;}
}

</style>

</defs>

<!-- terminal -->

<rect
x="20"
y="20"
width="860"
height="500"
rx="18"
fill="url(#bg)"
stroke="#2d3550"
stroke-width="2"
filter="url(#shadow)"/>

<!-- titlebar -->

<circle cx="50" cy="46" r="8" fill="#ff5f56"/>
<circle cx="76" cy="46" r="8" fill="#ffbd2e"/>
<circle cx="102" cy="46" r="8" fill="#27c93f"/>

<text
x="145"
y="52"
class="gray">
vlastimir@arch:~
</text>

<line
x1="20"
y1="74"
x2="880"
y2="74"
stroke="#27324b"/>

<!-- prompt -->

<text
x="50"
y="118"
class="green">
$ fastfetch
</text>

<rect
x="182"
y="100"
width="8"
height="22"
class="cursor"/>

<!-- divider -->

<line
x1="300"
y1="125"
x2="300"
y2="470"
stroke="#27324b"
stroke-width="2"/>


<!-- Arch Linux Logo -->

<text x="55" y="170" class="arch">       /\</text>
<text x="55" y="195" class="arch">      /  \</text>
<text x="55" y="220" class="arch">     /\   \</text>
<text x="55" y="245" class="arch">    /      \</text>
<text x="55" y="270" class="arch">   /   ,,   \</text>
<text x="55" y="295" class="arch">  /   |  |  -\</text>
<text x="55" y="320" class="arch"> /_-''    ''-_\</text>

<!-- System Information -->

<text x="340" y="130" class="green">$ whoami</text>

<text x="340" y="170" class="label">OS</text>
<text x="500" y="170" class="value">Arch Linux</text>

<text x="340" y="205" class="label">User</text>
<text x="500" y="205" class="value">Vlastimir</text>

<text x="340" y="240" class="label">Shell</text>
<text x="500" y="240" class="value">zsh</text>

<text x="340" y="275" class="label">Editor</text>
<text x="500" y="275" class="value">Neovim</text>

<text x="340" y="310" class="label">Languages</text>
<text x="500" y="310" class="value">Python • C++</text>

<text x="340" y="345" class="label">Focus</text>
<text x="500" y="345" class="value">AI • Cybersecurity</text>

<line
x1="340"
y1="375"
x2="820"
y2="375"
stroke="#27324b"/>

<text
x="340"
y="415"
class="green">
$ activity
</text>

<!-- Activity -->

<text x="365" y="455" class="term">$ git status</text>
<text x="390" y="485" class="green">✓ working tree clean</text>

<text x="365" y="520" class="term">$ python main.py</text>
<text x="390" y="550" class="green">✓ Building GitHub profile...</text>

<text x="365" y="585" class="term">$ tryhackme</text>
<text x="390" y="615" class="green">✓ Grinding Linux Fundamentals</text>

<text x="365" y="650" class="term">$ leetcode</text>
<text x="390" y="680" class="green">✓ Solving today's problem</text>

<!-- Bottom divider -->

<line
x1="20"
y1="470"
x2="880"
y2="470"
stroke="#27324b"/>

<!-- Bottom prompt -->

<text
x="45"
y="500"
class="green">
vlastimir@arch
</text>

<text
x="180"
y="500"
class="term">
:
</text>

<text
x="190"
y="500"
fill="#60a5fa"
font-size="20">
~
</text>

<text
x="208"
y="500"
class="term">
$
</text>

<rect
x="225"
y="482"
width="8"
height="22"
fill="#6ea8ff">

<animate
attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>

</rect>

</svg>
