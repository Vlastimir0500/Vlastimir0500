<svg xmlns="http://www.w3.org/2000/svg"
     width="820"
     height="520"
     viewBox="0 0 820 520">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0c111b"/>
<stop offset="100%" stop-color="#111827"/>
</linearGradient>

<filter id="shadow">
<feDropShadow dx="0"
dy="0"
stdDeviation="10"
flood-color="#6ea8ff"
flood-opacity="0.35"/>
</filter>

<style>

text{
font-family:Consolas,'Courier New',monospace;
}

.title{
fill:#9cb7ff;
font-size:24px;
font-weight:bold;
}

.label{
fill:#78a7ff;
font-size:18px;
}

.value{
fill:#f2f4f8;
font-size:18px;
}

.green{
fill:#66ff7a;
font-size:18px;
}

.gray{
fill:#8892a7;
font-size:16px;
}

.cursor{
fill:#7aa7ff;
animation:blink 1s infinite;
}

@keyframes blink{

0%,50%{
opacity:1;
}

51%,100%{
opacity:0;
}

}

</style>

</defs>

<!-- Terminal -->

<rect
x="20"
y="20"
width="780"
height="480"
rx="20"
fill="url(#bg)"
stroke="#2f3852"
stroke-width="2"
filter="url(#shadow)"/>

<!-- Top Bar -->

<circle cx="52" cy="48" r="8" fill="#ff605c"/>
<circle cx="78" cy="48" r="8" fill="#ffbd44"/>
<circle cx="104" cy="48" r="8" fill="#00ca4e"/>

<text
x="145"
y="54"
class="gray">
root@vlastimir:~/profile
</text>

<line
x1="20"
y1="75"
x2="800"
y2="75"
stroke="#293248"/>

<!-- Prompt -->

<text
x="52"
y="115"
class="green">
$ neofetch
</text>

<rect
x="170"
y="99"
width="8"
height="22"
class="cursor"/>

<!-- Divider -->

<line
x1="250"
y1="120"
x2="250"
y2="470"
stroke="#2d3550"
stroke-width="2"/>

<!-- Linux Logo -->

<text x="55" y="165" class="label">      .--.</text>
<text x="55" y="190" class="label">     |o_o |</text>
<text x="55" y="215" class="label">     |:_/ |</text>
<text x="55" y="240" class="label">    //   \ \</text>
<text x="55" y="265" class="label">   (|     | )</text>
<text x="55" y="290" class="label">  /'\_   _/`\</text>
<text x="55" y="315" class="label">  \___)=(___/</text>

<!-- Right Side -->

<text x="290" y="145" class="green">$ whoami</text>

<text x="290" y="185" class="label">OS</text>
<text x="430" y="185" class="value">Linux</text>

<text x="290" y="215" class="label">User</text>
<text x="430" y="215" class="value">Vlastimir</text>

<text x="290" y="245" class="label">Role</text>
<text x="430" y="245" class="value">Computer Science Student</text>

<text x="290" y="275" class="label">Focus</text>
<text x="430" y="275" class="value">AI • Cybersecurity</text>

<text x="290" y="305" class="label">Languages</text>
<text x="430" y="305" class="value">Python • C++</text>

<text x="290" y="335" class="label">Shell</text>
<text x="430" y="335" class="value">bash</text>

<line
x1="290"
y1="360"
x2="740"
y2="360"
stroke="#2d3550"/>

<text x="290" y="395" class="green">$ currently</text>

<text x="315" y="430" class="value">▸ Writing Python code...</text>

<text x="315" y="460" class="value">▸ Grinding on TryHackMe...</text>

<line
x1="290"
y1="485"
x2="740"
y2="485"
stroke="#2d3550"/>

<text x="290" y="520" class="green">$ git status</text>

<text x="315" y="555" class="gray">
On branch main
</text>

<text x="315" y="580" class="gray">
Your branch is up to date with 'origin/main'.
</text>

<text x="315" y="605" class="green">
nothing to commit,
</text>

<text x="315" y="630" class="green">
working tree clean
</text>

<!-- Blinking Cursor -->

<rect
x="520"
y="613"
width="8"
height="20"
fill="#6ea8ff">

<animate
attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>

</rect>

<!-- Bottom Prompt -->

<line
x1="20"
y1="458"
x2="800"
y2="458"
stroke="#293248"/>

<text
x="52"
y="485"
class="green">
$
</text>

<rect
x="66"
y="469"
width="8"
height="20"
fill="#6ea8ff">

<animate
attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>

</rect>

</svg>
