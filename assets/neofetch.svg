<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="50%" stop-color="#8a8a8a"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161616" stroke-width="0.6"/>
    </pattern>
    <clipPath id="roundClip">
      <rect x="0" y="0" width="900" height="600" rx="16" ry="16"/>
    </clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text { font-family: 'JetBrains Mono','Fira Code',Consolas,Menlo,monospace; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .pulseBorder { animation: pulse 3s ease-in-out infinite; }
      .pulseDot { animation: dotPulse 2s ease-in-out infinite; }
      @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
      @keyframes pulse { 0%,100% { opacity:0.35; } 50% { opacity:0.75; } }
      @keyframes dotPulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
    </style>
  </defs>

  <!-- outer border, slow pulse -->
  <rect class="pulseBorder" x="1" y="1" width="898" height="598" rx="16" ry="16" fill="none" stroke="url(#borderGlow)" stroke-width="1.5"/>

  <g clip-path="url(#roundClip)">
    <rect x="0" y="0" width="900" height="600" fill="url(#bgGlow)"/>
    <rect x="0" y="0" width="900" height="600" fill="url(#grid)" opacity="0.5"/>

    <!-- scanning beam -->
    <rect x="40" y="72" width="820" height="2" fill="url(#scanGrad)" opacity="0.4">
      <animate attributeName="y" values="72;408;72" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- title bar -->
    <rect x="0" y="0" width="900" height="48" fill="#0e0e0e"/>
    <line x1="0" y1="48" x2="900" y2="48" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="28" cy="24" r="6.5" fill="#4a4a4a"/>
    <circle cx="50" cy="24" r="6.5" fill="#6a6a6a"/>
    <circle cx="72" cy="24" r="6.5" fill="#8a8a8a"/>
    <text x="450" y="29" text-anchor="middle" font-size="13" fill="#565656" font-weight="500" letter-spacing="0.5">vlastimir@arch:~</text>
    <circle cx="836" cy="24" r="4" fill="#ffffff" class="pulseDot" filter="url(#glow)"/>
    <text x="850" y="28" font-size="11" fill="#767676" letter-spacing="1">ONLINE</text>

    <!-- vertical divider -->
    <line x1="450" y1="72" x2="450" y2="410" stroke="#2a2a2a" stroke-width="1"/>

    <!-- LEFT COLUMN: fastfetch -->
    <text x="42" y="130" font-size="16" font-weight="700" fill="#ffffff" filter="url(#glow)">$</text>
    <text x="62" y="130" font-size="16" fill="#c9c9c9">fastfetch</text>
    <rect x="150" y="117" width="9" height="16" fill="#ffffff" class="blink" filter="url(#glow)"/>

    <text x="225" y="180" text-anchor="middle" font-size="17" font-weight="600" fill="#e8e8e8" filter="url(#glow)">
      <tspan x="225">/\</tspan>
      <tspan x="225" dy="25">/  \</tspan>
      <tspan x="225" dy="25">/ /\ \</tspan>
      <tspan x="225" dy="25">/ /  \ \</tspan>
      <tspan x="225" dy="25">/ /____\ \</tspan>
      <tspan x="225" dy="25">/_/    \_\</tspan>
    </text>
    <text x="225" y="345" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1.5" fill="#ffffff">Arch Linux</text>

    <!-- RIGHT COLUMN: whoami -->
    <text x="490" y="130" font-size="16" font-weight="700" fill="#ffffff" filter="url(#glow)">$</text>
    <text x="510" y="130" font-size="16" fill="#c9c9c9">whoami</text>

    <text x="490" y="168" font-size="14.5" font-weight="700" fill="#e6e6e6">OS</text>
    <text x="650" y="168" font-size="14.5" fill="#8f8f8f">Arch Linux</text>

    <text x="490" y="198" font-size="14.5" font-weight="700" fill="#e6e6e6">Host</text>
    <text x="650" y="198" font-size="14.5" fill="#8f8f8f">github.com</text>

    <text x="490" y="228" font-size="14.5" font-weight="700" fill="#e6e6e6">User</text>
    <text x="650" y="228" font-size="14.5" fill="#8f8f8f">Vlastimir</text>

    <text x="490" y="258" font-size="14.5" font-weight="700" fill="#e6e6e6">Shell</text>
    <text x="650" y="258" font-size="14.5" fill="#8f8f8f">zsh</text>

    <text x="490" y="288" font-size="14.5" font-weight="700" fill="#e6e6e6">Editor</text>
    <text x="650" y="288" font-size="14.5" fill="#8f8f8f">Neovim</text>

    <text x="490" y="318" font-size="14.5" font-weight="700" fill="#e6e6e6">Languages</text>
    <text x="650" y="318" font-size="14.5" fill="#8f8f8f">Python &#8226; C++</text>

    <text x="490" y="348" font-size="14.5" font-weight="700" fill="#e6e6e6">Focus</text>
    <text x="650" y="348" font-size="14.5" fill="#8f8f8f">AI &#8226; Cybersecurity</text>

    <text x="490" y="378" font-size="14.5" font-weight="700" fill="#e6e6e6">Learning</text>
    <text x="650" y="378" font-size="14.5" fill="#8f8f8f">LeetCode &#8226; TryHackMe</text>

    <!-- separator -->
    <line x1="34" y1="410" x2="866" y2="410" stroke="#2a2a2a" stroke-width="1"/>

    <!-- STATUS SECTION -->
    <text x="42" y="452" font-size="16" font-weight="700" fill="#ffffff" filter="url(#glow)">$</text>
    <text x="62" y="452" font-size="16" fill="#c9c9c9">status</text>

    <text x="42" y="488" font-size="14.5" font-weight="700" fill="#e6e6e6">Working</text>
    <text x="180" y="488" font-size="14.5" fill="#8f8f8f">Security Automation Tools</text>

    <text x="42" y="520" font-size="14.5" font-weight="700" fill="#e6e6e6">Research</text>
    <text x="180" y="520" font-size="14.5" fill="#8f8f8f">Adversarial ML &amp; Graph Networks</text>

    <text x="42" y="552" font-size="14.5" font-weight="700" fill="#e6e6e6">Coding</text>
    <text x="180" y="552" font-size="14.5" fill="#8f8f8f">Python &#8226; C++ &#8226; Rust</text>
  </g>

  <!-- corner frame -->
  <g stroke="#3a3a3a" stroke-width="2" fill="none" opacity="0.9">
    <path d="M10,30 L10,10 L30,10"/>
    <path d="M890,30 L890,10 L870,10"/>
    <path d="M10,570 L10,590 L30,590"/>
    <path d="M890,570 L890,590 L870,590"/>
  </g>

  <!-- crisp outer border -->
  <rect x="0.75" y="0.75" width="898.5" height="598.5" rx="15.25" ry="15.25" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
</svg>
